; M5Paper Mono (SKU: C153 / C153-LITE) - ESP32-S3R8 + 4.7inch monochrome E-Ink
; PlatformIO 用のボード定義はまだ無いので、esp32-s3-devkitc-1 をベースに
; 16MB Flash / 8MB Octal PSRAM の構成を手動指定している。

[env:papermono]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi   ; Flash=QSPI / PSRAM=OPI (S3R8)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; PaperMono 対応は develop ブランチにのみ入っているため git 直指定
lib_deps =
    https://github.com/m5stack/M5GFX.git#develop
    https://github.com/m5stack/M5Unified.git#develop
    ; LoRa (SX1262) と、その電源/リセットを握る PMIC・I/O エキスパンダ
    jgromes/RadioLib@^7.2.1
    https://github.com/m5stack/M5PM1.git
    https://github.com/m5stack/M5IOE1.git

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
